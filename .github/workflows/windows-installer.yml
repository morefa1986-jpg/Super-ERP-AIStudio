name: Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:core
      - run: npm run build
      - name: Production smoke test
        shell: pwsh
        run: |
          $env:NODE_ENV = 'production'
          $env:PORT = '4318'
          $env:HOST = '127.0.0.1'
          $server = Start-Process -FilePath node -ArgumentList 'dist/server.cjs' -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:4318/api/health' -TimeoutSec 2
                if ($response.success -eq $true -and $response.status -eq 'ok') { $healthy = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $healthy) { throw 'Production health check failed.' }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package,package\dist | Out-Null
          Copy-Item dist\server.cjs package -Force
          Copy-Item dist\index.html,dist\assets package\dist -Recurse -Force
          Copy-Item package.json,package-lock.json,scripts\start-fathi-erp.cmd,scripts\windows-bootstrap-uninstaller.ps1 package -Force
          Compress-Archive -Path package\* -DestinationPath FathiAquaSuperERP-package.zip -Force
          Copy-Item scripts\windows-bootstrap-installer.ps1 .
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $testPath = Join-Path $env:RUNNER_TEMP 'FathiAquaERP-TestInstall'
          "${testPath}" | .\windows-bootstrap-installer.ps1 -Package "${{ github.workspace }}\FathiAquaSuperERP-package.zip" -NoShortcut
          if (-not (Test-Path (Join-Path $testPath 'server.cjs'))) { throw 'Installer did not copy server bundle.' }
          'Y' | .\scripts\windows-bootstrap-uninstaller.ps1 -InstallPath $testPath
          if (Test-Path $testPath) { throw 'Uninstaller did not remove test installation.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fathi-Aqua-SuperERP-Windows
          path: |
            FathiAquaSuperERP-package.zip
            windows-bootstrap-installer.ps1
            package
  browser-smoke:
    runs-on: ubuntu-latest
    needs: build-windows-package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
