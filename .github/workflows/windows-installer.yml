name: Build Windows Offline Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type check and tests
        run: |
          npm run lint
          npm run test:core

      - name: Build Setup.exe and MSI
        run: npm run desktop:make

      - name: Upload offline installer
        uses: actions/upload-artifact@v4
        with:
          name: Fathi-Aqua-SuperERP-Windows
          path: |
            out/make/**/*.exe
            out/make/**/*.msi
            out/make/**/*.nupkg
          if-no-files-found: error
          retention-days: 30
